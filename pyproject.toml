[project]
name = "lightshow"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "dbus-next>=0.2.3",
  "distro>=1.9.0",
  "matplotlib>=3.11.2",
  "mido[ports-rtmidi]>=1.3.3",
  "numpy>=2.5.4",
  "pydantic-extra-types>=2.11.1",
  "pydantic[email]>=2.14.1",
  "pyinstaller>=6.22.3",
  "pyopengl>=3.1.10",
  "pyopengl-accelerate>=3.1.10",
  "pyqtgraph>=0.14.0",
  "pyside6>=6.12.0",
  "requests>=2.34.2",
  "semver>=3.1.0",
  "soundcard>=0.4.6",
  "ty>=0.0.89",
  "websocket-client>=1.9.2",
  "winrt-runtime>=3.2.1 ; platform_system == \"Windows\"",
  "winrt-windows-foundation>=3.2.1 ; platform_system == \"Windows\"",
  "winrt-windows-foundation-collections>=3.2.1 ; platform_system == \"Windows\"",
  "winrt-windows-media>=3.2.1 ; platform_system == \"Windows\"",
  "winrt-windows-media-control>=3.2.1 ; platform_system == \"Windows\"",
]

[project.scripts]
lightshow = "lightshow.__main__:main"

[project.entry-points."commitizen.plugin"]
cz_conventional_chore = "scripts.cz_conventional_chore:ConventionalChoreCz"

[dependency-groups]
dev = [
  "commitizen>=4.19.2",
  "import-linter>=2.15",
  "isort>=9.0.1",
  "pre-commit>=4.7.0",
  "rope>=1.15.0",
  "ruff>=0.17.1",
  "ty>=0.0.89",
]

[build-system]
requires = ["pdm-backend>=2.5.0"]
build-backend = "pdm.backend"

[tool.commitizen]
name = "cz_conventional_chore"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.importlinter]
root_package = "lightshow"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "No Qt outside gui (except signals)"
type = "forbidden"
source_modules = [
  "lightshow.devices",
  "lightshow.audio",
  "lightshow.media",
  "lightshow.document",
]
forbidden_modules = ["PySide6"]
allow_indirect_imports = true
ignore_imports = [
  "lightshow.audio.events -> PySide6",
  "lightshow.devices.events -> PySide6",
]

[tool.setuptools]
py-modules = []

[tool.ty.src]
exclude = ["scripts/cz_conventional_chore.py", "scripts/mv_module.py"]

[tool.uv]
link-mode = "copy"
default-groups = []

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
lightshow = { workspace = true }
