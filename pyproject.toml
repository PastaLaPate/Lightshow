[project]
name = "lightshow"
version = "0.32.1"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "PyQt6>=6.7.0",
  "PyQt6-Charts>=6.7.0",
  "dbus-next>=0.2.3",
  "distro>=1.9.0",
  "matplotlib>=3.11.2",
  "mido[ports-rtmidi]>=1.3.3",
  "numpy>=2.5.3",
  "pydantic>=2.13.5",
  "pyinstaller>=6.22.3",
  "pyopengl>=3.1.10",
  "pyopengl-accelerate>=3.1.10",
  "pyqtgraph>=0.14.0",
  "requests>=2.34.2",
  "semver>=3.1.0",
  "soundcard>=0.4.6",
  "ty>=0.0.82",
  "websocket-client>=1.9.2",
  "winrt-runtime>=3.2.1 ; platform_system == \"Windows\"",
  "winrt-windows-foundation>=3.2.1 ; platform_system == \"Windows\"",
  "winrt-windows-foundation-collections>=3.2.1 ; platform_system == \"Windows\"",
  "winrt-windows-media>=3.2.1 ; platform_system == \"Windows\"",
  "winrt-windows-media-control>=3.2.1 ; platform_system == \"Windows\"",
]

[project.scripts]
lightshow = "lightshow.__main__:main"

[project.entry-points."commitizen.plugin"]
cz_conventional_chore = "cz_conventional_chore:ConventionalChoreCz"

[dependency-groups]
dev = [
  "commitizen>=4.19.1",
  "isort>=9.0.1",
  "pre-commit>=4.6.2",
  "ruff>=0.16.8",
  "ty>=0.0.82",
]

[build-system]
requires = ["pdm-backend>=2.4.9"]
build-backend = "pdm.backend"

[tool.commitizen]
name = "cz_conventional_chore"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.setuptools]
py-modules = []

[tool.uv]
link-mode = "copy"
default-groups = []

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
lightshow = { workspace = true }
